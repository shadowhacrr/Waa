<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp - Pakistani Chat</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Chat List -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="header-top">
                    <h2>WhatsApp</h2>
                    <div class="header-icons">
                        <i class="fas fa-camera"></i>
                        <i class="fas fa-search" id="search-btn"></i>
                        <i class="fas fa-ellipsis-v"></i>
                    </div>
                </div>
                <div class="search-box" id="search-box">
                    <div class="search-input-wrapper">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" placeholder="Search or start new chat" id="search-input">
                        <i class="fas fa-times clear-search" id="clear-search"></i>
                    </div>
                </div>
                <div class="tabs">
                    <span class="tab active">All</span>
                    <span class="tab">Unread</span>
                    <span class="tab">Groups</span>
                </div>
            </div>
            
            <div class="chat-list" id="chat-list">
                <!-- Chat items will be loaded here dynamically -->
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-area" id="chat-area">
            <!-- Empty State -->
            <div class="empty-state" id="empty-state">
                <div class="empty-content">
                    <div class="whatsapp-bg-logo">
                        <i class="fab fa-whatsapp"></i>
                    </div>
                    <h3>WhatsApp for Pakistani Chat</h3>
                    <p>Select a chat to start messaging with your Pakistani friends.</p>
                    <div class="empty-footer">
                        <i class="fas fa-lock"></i>
                        <span>Your personal messages are end-to-end encrypted</span>
                    </div>
                </div>
            </div>

            <!-- Active Chat -->
            <div class="active-chat hidden" id="active-chat">
                <!-- Chat Header -->
                <div class="chat-header">
                    <div class="header-left">
                        <button class="back-btn" id="back-btn">
                            <i class="fas fa-arrow-left"></i>
                        </button>
                        <div class="contact-info">
                            <img src="" alt="" class="contact-avatar" id="contact-avatar">
                            <div class="contact-details">
                                <h3 class="contact-name" id="contact-name"></h3>
                                <span class="contact-status" id="contact-status">online</span>
                            </div>
                        </div>
                    </div>
                    <div class="header-right">
                        <i class="fas fa-video"></i>
                        <i class="fas fa-phone"></i>
                        <i class="fas fa-search"></i>
                        <i class="fas fa-ellipsis-v"></i>
                    </div>
                </div>

                <!-- Chat Messages -->
                <div class="chat-messages" id="chat-messages">
                    <!-- Messages will be loaded here -->
                </div>

                <!-- Typing Indicator -->
                <div class="typing-indicator hidden" id="typing-indicator">
                    <div class="typing-bubble">
                        <div class="typing-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>

                <!-- Chat Input -->
                <div class="chat-input-area">
                    <div class="input-wrapper">
                        <i class="far fa-laugh input-icon emoji-btn"></i>
                        <div class="message-input-container">
                            <input type="text" 
                                   class="message-input" 
                                   id="message-input" 
                                   placeholder="Type a message"
                                   autocomplete="off">
                        </div>
                        <i class="fas fa-paperclip input-icon attach-btn"></i>
                        <button class="send-btn" id="send-btn">
                            <i class="fas fa-microphone" id="mic-icon"></i>
                            <i class="fas fa-paper-plane hidden" id="send-icon"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
